id: nut_nut_source_video
label: NUT Video Source
category: '[NUT]'

templates:
  imports: from gnuradio import nut
  make: nut.nut_source(${uri}, 0, True, ${command})

parameters:
- id: command
  label: Spawn Command
  dtype: string
  default: 'ffmpeg -loglevel warning -i /tmp/video.mp4 -an -vf "fps=25,scale=640:480:force_original_aspect_ratio=decrease,pad=640:480:-1:-1,setsar=1" -c:v rawvideo -pix_fmt rgb24 -fps_mode cfr -max_interleave_delta 500000 -f nut pipe:1'
- id: uri
  label: NUT File
  dtype: string
  default: ''
  hide: part

outputs:
- label: video
  domain: stream
  dtype: byte

asserts:
- ${command != '' or uri != ''}

documentation: |-
  Video-only instance of nut.nut_source: ingests a raw-payload NUT stream
  produced by ffmpeg (from a FIFO or file) and emits rgb24 bytes, frame
  after frame (row-major). Same C++ block as "NUT Audio Source" and
  "NUT A/V Source" — the three GRC entries only differ in the declared
  stream layout.

  Contract (a strict profile of NUT; structural mismatches are hard
  errors at start): rawvideo rgb24, constant frame rate, the only stream
  in the container. The geometry is read from the stream headers and
  adopted at start (cap: 1920x1080) — your ffmpeg command is the single
  source of truth, and downstream consumers must match your command; the
  adopted values are available as video_width()/video_height() after
  start. A stream tag ("pts" in the NUT stream timebase, "width",
  "height") is attached to the first byte of every frame.

  Two plumbing modes (exactly one of Spawn Command / NUT File must be
  set):
  * Spawn Command (the default mode, POSIX only): a full shell command;
    the block runs it via /bin/sh -c and reads NUT from its stdout,
    terminating and reaping it on stop. The command must write NUT to
    stdout, e.g.:
      ffmpeg -i INPUT -an \
        -vf "fps=FPS,scale=W:H:force_original_aspect_ratio=decrease,pad=W:H:-1:-1,setsar=1" \
        -c:v rawvideo -pix_fmt rgb24 -fps_mode cfr \
        -max_interleave_delta 500000 -f nut pipe:1
    Validation at start is the guardrail. For seamless looping add
    -stream_loop -1 before -i. The default command is ready to run
    against /tmp/video.mp4 and conforms it to 640x480 @ 25 fps; whatever
    geometry/fps your command produces is what the block adopts.
  * NUT File (properties dialog; for users who know what they're doing):
    an externally started ffmpeg writes the FIFO/file named here. Same
    reference command, ending in "-f nut pipe:1 > FIFO".

  The flowgraph sink must be the only clock: do NOT add a Throttle; ffmpeg
  is paced purely by pipe backpressure (no -re).

  Buffering: the video port defaults to 4 x 1920x1080x3 bytes (~24.9 MB,
  four cap-sized frames) via a plain set_min_output_buffer request —
  overridable in the Advanced tab (Min Output Buffer, wins when non-zero)
  or from Python. GR allocates buffers before the headers are readable,
  hence the fixed cap. Warning: shrinking below ~4 frames / the stream's
  interleave burst re-opens the demuxer-deadlock window this default
  exists to close (GR default buffers are tens of kB while a raw frame is
  MBs).

  Full explanation of the buffering/synchronization design: see the
  gr-nut README, section "Buffering & synchronization" (docs/buffering.md).

file_format: 1
