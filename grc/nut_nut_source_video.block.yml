id: nut_nut_source_video
label: NUT Video Source
category: '[nut]'

templates:
  imports: from gnuradio import nut
  make: nut.nut_source(${uri}, 0, 0, True, ${video_width}, ${video_height}, ${command})

parameters:
- id: command
  label: Spawn Command
  dtype: string
  default: ''
- id: uri
  label: NUT File
  dtype: string
  default: ''
  hide: part
- id: video_width
  label: Video Width
  dtype: int
  default: '320'
- id: video_height
  label: Video Height
  dtype: int
  default: '240'

outputs:
- label: video
  domain: stream
  dtype: byte

asserts:
- ${command != '' or uri != ''}
- ${video_width > 0 and video_height > 0}

documentation: |-
  Video-only instance of nut.nut_source: ingests a raw-payload NUT stream
  produced by ffmpeg (from a FIFO or file) and emits rgb24 bytes, frame
  after frame (row-major). Same C++ block as "NUT Audio Source" and
  "NUT A/V Source" — the three GRC entries only differ in the declared
  stream layout.

  Contract (a strict profile of NUT; any mismatch is a hard error at
  start): rawvideo rgb24, exactly Width x Height, constant frame rate, the
  only stream in the container. A stream tag ("pts" in the NUT stream
  timebase, "width", "height") is attached to the first byte of every
  frame; steady-state consumers must not need it (geometry is
  contractual).

  Two plumbing modes (exactly one of Spawn Command / NUT File must be
  set):
  * Spawn Command (the default mode, POSIX only): a full shell command;
    the block runs it via /bin/sh -c and reads NUT from its stdout,
    terminating and reaping it on stop. The command must write NUT to
    stdout, e.g.:
      ffmpeg -i INPUT -an \
        -vf "fps=FPS,scale=W:H:force_original_aspect_ratio=decrease,pad=W:H:-1:-1,setsar=1" \
        -c:v rawvideo -pix_fmt rgb24 -fps_mode cfr \
        -max_interleave_delta 500000 -f nut pipe:1
    Validation at start is the guardrail. For seamless looping add
    -stream_loop -1 before -i.
  * NUT File (properties dialog; for users who know what they're doing):
    an externally started ffmpeg writes the FIFO/file named here. Same
    reference command, ending in "-f nut pipe:1 > FIFO".

  The flowgraph sink must be the only clock: do NOT add a Throttle; ffmpeg
  is paced purely by pipe backpressure (no -re).

  Buffering: the block requests >= 4 frames (4 x W x H x 3 bytes) of
  buffer on the video port (deadlock prevention, see the block header
  docs; GR default buffers are tens of kB while a raw frame is MBs) — do
  not shrink.

file_format: 1
