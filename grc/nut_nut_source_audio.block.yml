id: nut_nut_source_audio
label: NUT Audio Source
category: '[nut]'

templates:
  imports: from gnuradio import nut
  make: nut.nut_source(${uri}, ${audio_channels}, False, ${command})

parameters:
- id: command
  label: Spawn Command
  dtype: string
  default: 'ffmpeg -loglevel warning -i /tmp/song.mp3 -vn -af aresample=48000:async=1 -ac 1 -c:a pcm_f32le -max_interleave_delta 500000 -f nut pipe:1'
- id: uri
  label: NUT File
  dtype: string
  default: ''
  hide: part
- id: audio_channels
  label: Audio Channels
  dtype: int
  default: '1'

outputs:
- label: audio
  domain: stream
  dtype: float
  multiplicity: ${audio_channels}

asserts:
- ${command != '' or uri != ''}
- ${audio_channels >= 1}

documentation: |-
  Audio-only instance of nut.nut_source: ingests a raw-payload NUT stream
  produced by ffmpeg (from a FIFO or file) and emits deinterleaved float
  audio, one port per channel. Same C++ block as "NUT Video Source" and
  "NUT A/V Source" — the three GRC entries only differ in the declared
  stream layout.

  Contract (a strict profile of NUT; structural mismatches are hard
  errors at start): pcm_f32le, interleaved, exactly Audio Channels
  channels, the only stream in the container. The sample rate is read
  from the stream headers and adopted at start (cap: 192 kHz) — your
  ffmpeg command is the single source of truth, and the downstream
  flowgraph (resampler ratios etc.) must match your command. The adopted
  rate is available as audio_rate() after start.

  Two plumbing modes (exactly one of Spawn Command / NUT File must be
  set):
  * Spawn Command (the default mode, POSIX only): a full shell command;
    the block runs it via /bin/sh -c and reads NUT from its stdout,
    terminating and reaping it on stop. The command must write NUT to
    stdout, e.g. (mono; stereo: -ac 2):
      ffmpeg -i song.flac -vn -af aresample=48000:async=1 -ac 1 \
        -c:a pcm_f32le -max_interleave_delta 500000 -f nut pipe:1
    Anything goes (pipelines, curl | ffmpeg, extra filters) as long as
    stdout is contract-conforming NUT; validation at start is the
    guardrail. For seamless looping add -stream_loop -1 before -i.
    The default command is ready to run against /tmp/song.mp3 (mono @
    48000 Hz); the command's -ac must match Audio Channels, and whatever
    rate its aresample sets is what the block adopts.
  * NUT File (properties dialog; for users who know what they're doing):
    an externally started ffmpeg writes the FIFO/file named here. Same
    reference command, ending in "-f nut pipe:1 > FIFO".

  The flowgraph sink (SDR/audio device) must be the only clock: do NOT add
  a Throttle; ffmpeg is paced purely by pipe backpressure (no -re).

  Buffering: each audio port defaults to a 192000-item buffer (1 s at the
  192 kHz cap) via a plain set_min_output_buffer request — overridable in
  the Advanced tab (Min Output Buffer, wins when non-zero) or from
  Python. Warning: shrinking below the stream's interleave burst
  (-max_interleave_delta) re-opens the demuxer-deadlock window these
  defaults exist to close.

  Full explanation of the buffering/synchronization design: see the
  gr-nut README, section "Buffering & synchronization" (docs/buffering.md).

file_format: 1
