id: nut_nut_source
label: NUT Source
category: '[nut]'

templates:
  imports: from gnuradio import nut
  make: nut.nut_source(${uri}, ${audio_channels}, ${audio_rate}, ${emit_video}, ${video_width}, ${video_height}, ${repeat})

parameters:
- id: uri
  label: URI (FIFO or file)
  dtype: string
  default: '/tmp/stream.nut'
- id: audio_channels
  label: Audio Channels
  dtype: int
  default: '1'
- id: audio_rate
  label: Audio Rate (Hz)
  dtype: int
  default: '48000'
  hide: ${'none' if audio_channels else 'all'}
- id: emit_video
  label: Emit Video
  dtype: bool
  default: 'False'
  options: ['True', 'False']
  option_labels: ['Yes', 'No']
- id: video_width
  label: Video Width
  dtype: int
  default: '0'
  hide: ${'none' if emit_video else 'all'}
- id: video_height
  label: Video Height
  dtype: int
  default: '0'
  hide: ${'none' if emit_video else 'all'}
- id: repeat
  label: Repeat
  dtype: bool
  default: 'False'
  options: ['True', 'False']
  option_labels: ['Yes', 'No']

outputs:
- label: audio
  domain: stream
  dtype: float
  multiplicity: ${audio_channels}
- label: video
  domain: stream
  dtype: byte
  optional: true
  hide: ${not emit_video}

asserts:
# GRC cannot represent a block whose first stream port has multiplicity 0
# (port counts are clamped to >= 1), so this GRC entry requires audio.
# For a video-only instance use "NUT Source (Video Only)"
# (nut_nut_source_video) — same C++ block, audio_channels=0.
- ${audio_channels > 0}
- ${(not emit_video) or (video_width > 0 and video_height > 0)}

documentation: |-
  Ingests a raw-payload NUT stream produced by ffmpeg (from a FIFO or file)
  and emits deinterleaved float audio (one port per channel) plus an
  optional rgb24 video byte stream.

  Contract (a strict profile of NUT; any mismatch is a hard error at start):
    * audio: pcm_f32le, interleaved, exactly Audio Channels @ Audio Rate
    * video: rawvideo rgb24, exactly Width x Height, constant frame rate
    * stream layout: exactly the declared set of streams

  Reference ffmpeg command (audio-only, mono):
    ffmpeg -i INPUT -vn -af "aresample=48000:async=1" -ac 1 \
      -c:a pcm_f32le -max_interleave_delta 500000 -f nut pipe:1 > FIFO

  Audio + video:
    ffmpeg -i INPUT \
      -filter_complex "[0:v]fps=FPS,scale=W:H:force_original_aspect_ratio=decrease,pad=W:H:-1:-1,setsar=1[v];[0:a]aresample=48000:async=1[a]" \
      -map "[v]" -map "[a]" -c:v rawvideo -pix_fmt rgb24 -c:a pcm_f32le \
      -fps_mode cfr -max_interleave_delta 500000 -f nut pipe:1 > FIFO

  The flowgraph sink (SDR/audio device) must be the only clock: do NOT add
  a Throttle; ffmpeg is paced purely by pipe backpressure (no -re).

  A stream tag ("pts" in the NUT stream timebase, "width", "height") is
  attached to the first byte of every video frame. When both audio and
  video are declared, the initial pts offset between them is trimmed at
  startup so both ports begin at the same media time.

  Buffering: the block requests >= 1 s of buffer on each audio port and
  >= 4 frames on the video port. This is deadlock prevention (the NUT muxer
  bounds interleave skew via -max_interleave_delta, so buffers larger than
  the interleave burst guarantee a synchronous downstream combiner can
  always be fed) — do not shrink these.

file_format: 1
