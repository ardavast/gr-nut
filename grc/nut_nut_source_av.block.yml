id: nut_nut_source_av
label: NUT A/V Source
category: '[NUT]'

templates:
  imports: from gnuradio import nut
  make: nut.nut_source(${uri}, ${audio_channels}, ${video_streams}, ${command})

parameters:
- id: command
  label: Spawn Command
  dtype: string
  default: 'ffmpeg -loglevel warning -i /tmp/video.mp4 -filter_complex "[0:v]fps=25,scale=640:480:force_original_aspect_ratio=decrease,pad=640:480:-1:-1,setsar=1[v];[0:a]aresample=48000:async=1[a]" -map "[v]" -map "[a]" -ac 1 -c:v rawvideo -pix_fmt rgb24 -c:a pcm_f32le -fps_mode cfr -max_interleave_delta 500000 -f nut pipe:1'
- id: uri
  label: NUT File
  dtype: string
  default: ''
  hide: part
- id: audio_channels
  label: Audio Channels
  dtype: int
  default: '1'
- id: video_streams
  label: Video Streams
  dtype: int
  default: '1'

outputs:
- label: audio
  domain: stream
  dtype: float
  multiplicity: ${audio_channels}
- label: video
  domain: stream
  dtype: byte
  multiplicity: ${video_streams}

asserts:
- ${command != '' or uri != ''}
- ${audio_channels >= 1}
- ${video_streams >= 1}

documentation: |-
  Audio + video instance of nut.nut_source: ingests a raw-payload NUT
  stream produced by ffmpeg (from a FIFO or file) and emits deinterleaved
  float audio (one port per channel) plus rgb24 bytes, frame after frame
  (row-major). Same C++ block as "NUT Audio Source" and "NUT Video
  Source" — the three GRC entries only differ in the declared stream
  layout.

  Contract (a strict profile of NUT; structural mismatches are hard
  errors at start):
    * audio: pcm_f32le, interleaved, exactly Audio Channels channels
    * video: rawvideo rgb24, constant frame rate
    * stream layout: exactly one audio and one video stream
  The audio rate and the video geometry are read from the stream headers
  and adopted at start (caps: 192 kHz audio, 1920x1080 video) — your
  ffmpeg command is the single source of truth, and the downstream
  flowgraph must match your command. Adopted values are available as
  audio_rate()/video_width()/video_height() after start.

  Two plumbing modes (exactly one of Spawn Command / NUT File must be
  set):
  * Spawn Command (the default mode, POSIX only): a full shell command;
    the block runs it via /bin/sh -c and reads NUT from its stdout,
    terminating and reaping the whole process group on stop. The command
    must write NUT to stdout, e.g.:
      ffmpeg -i INPUT \
        -filter_complex "[0:v]fps=FPS,scale=W:H:force_original_aspect_ratio=decrease,pad=W:H:-1:-1,setsar=1[v];[0:a]aresample=48000:async=1[a]" \
        -map "[v]" -map "[a]" -c:v rawvideo -pix_fmt rgb24 -c:a pcm_f32le \
        -fps_mode cfr -max_interleave_delta 500000 -f nut pipe:1
    Anything goes (pipelines, curl | ffmpeg, extra filters) as long as
    stdout is contract-conforming NUT; validation at start is the
    guardrail. For seamless looping add -stream_loop -1 before -i.
    The default command is ready to run against /tmp/video.mp4 and
    conforms it to mono @ 48000 Hz + 640x480 @ 25 fps; the command's -ac
    must match Audio Channels, and whatever rate/geometry/fps it produces
    is what the block adopts.

  Multiple video streams: set Video Streams = N and emit N rawvideo
  streams; the i-th video -map feeds port video_i, each with
  independently adopted geometry. Example filtergraph producing two
  differently sized copies plus the audio:
      -filter_complex "[0:v]split=2[s0][s1];[s0]fps=25,scale=640:480:force_original_aspect_ratio=decrease,pad=640:480:-1:-1,setsar=1[v0];[s1]fps=25,scale=320:240:force_original_aspect_ratio=decrease,pad=320:240:-1:-1,setsar=1[v1];[0:a]aresample=48000:async=1[a]" \
      -map "[v0]" -map "[v1]" -map "[a]" ...
  There is still exactly ONE audio stream; to carry several programs'
  audio, merge them into its channels (e.g. "[0:a][1:a]amerge=inputs=2[a]"
  with -ac 4) — each channel comes out on its own float port.
  * NUT File (properties dialog; for users who know what they're doing):
    an externally started ffmpeg writes the FIFO/file named here. Same
    reference command, ending in "-f nut pipe:1 > FIFO".

  The flowgraph sink (SDR/audio device) must be the only clock: do NOT add
  a Throttle; ffmpeg is paced purely by pipe backpressure (no -re). Always
  pass -max_interleave_delta explicitly so the muxer bounds A/V interleave
  skew.

  A stream tag ("pts" in the NUT stream timebase, "width", "height") is
  attached to the first byte of every video frame. The initial pts offset
  between audio and video is trimmed at startup so both ports begin at the
  same media time (within one audio sample / one video frame); pts
  discontinuities beyond a few ms are logged, never resynced.

  Buffering: defaults are 192000 items per audio port (1 s at the
  192 kHz cap) and 4 x 1920x1080x3 bytes (~24.9 MB) on the video port —
  plain set_min_output_buffer requests, overridable in the Advanced tab
  (Min Output Buffer, wins when non-zero) or from Python. GR allocates
  buffers before the headers are readable, hence the fixed caps. This
  sizing is deadlock prevention (the NUT muxer bounds interleave skew via
  -max_interleave_delta, so buffers larger than the interleave burst
  guarantee a synchronous downstream combiner can always be fed);
  shrinking below the interleave burst re-opens that window.

  Full explanation of the buffering/synchronization design: see the
  gr-nut README, section "Buffering & synchronization" (docs/buffering.md).

file_format: 1
